spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/leese?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Hong_Kong
    username: root
    password:


  application:
    name: user-center

  # session 超时时间 (秒)
  session:
    timeout: 86400

mybatis-plus:
  # 指定 Mapper XML 路徑，根據你的實際目錄修改
  mapper-locations: classpath*:generator/mapper/*.xml
  type-aliases-package: com.leese.usercenter.model.entity

  configuration:
    # 是否開啟駝峰轉換 (false 表示關閉)
    map-underscore-to-camel-case: false

  global-config:
    db-config:
      logic-delete-field: isDelete        # 全局邏輯刪除字段名
      logic-delete-value: 1               # 邏輯已刪除值
      logic-not-delete-value: 0           # 邏輯未刪除值

alipay:
  app-id: 9021000162625441
  private-key: 
  alipay-public-key: 
  server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  charset: UTF-8
  sign-type: RSA2
  format: json
  # 支付成功后的异步回调地址（需内网穿透），必须是你后端的接口路径
  notify-url: https://reset-overstock-recliner.ngrok-free.dev/api/alipay/notify
  # 支付成功后的前端页面跳转地址（改成你本地前端的订单页地址）
  return-url: http://localhost:3000/order/customeorderlist

server:
  port: 8080
